# Moteur des sites clients sur Netlify (projet distinct du logiciel).
# Dans Netlify : « Base directory » vide, « Package directory » = apps/sites.
[build]
  command = "pnpm --filter @quercy/sites... build"
  publish = "apps/sites/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Moteur Next.js de Netlify (pages dynamiques, middleware, API).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pas de fonctions planifiées ici : la tâche quotidienne appartient au logiciel.
[functions]
  directory = "apps/sites/netlify/functions"
