# Déploiement autonome : `docker compose -f docker-compose.prod.yml --env-file .env.production up -d`
# (variables : voir .env.example ; DATABASE_URL et REDIS_URL sont fournis ci-dessous).
x-app: &app
  build: { context: ., target: web }
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://quercy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/quercy?schema=public
    REDIS_URL: redis://redis:6379
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quercy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: quercy
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quercy"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    build: { context: ., target: migrate }
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
