# Hébergement Render (Blueprint), offre gratuite, région Ohio (à côté de la base Neon,
# aws-us-east-2) :
#   - sebt : le logiciel, gardé éveillé par le flux GitHub « Réveil » (.github/workflows/reveil.yml)
#     qui lance aussi les tâches du jour (RUN_DAILY_ON_PING) ;
#   - sebt-sites : les sites des entreprises (s'endort après 15 minutes sans visite).
# Fichiers rangés dans la base (STORAGE_DRIVER=database) : l'offre gratuite n'a pas de disque.
# Les adresses croisées (SITES_APP_URL, SITES_BASE_URL du logiciel) sont réglées après la
# création, une fois les adresses .onrender.com connues.
services:
  - type: web
    name: sebt
    runtime: node
    plan: free
    region: ohio
    branch: claude/saas-modulaire-prompt-bgo7mm
    autoDeploy: true
    # Client Prisma, migrations, garde « base non vide », puis construction du logiciel.
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --filter '!@quercy/desktop...'
      && CONTEXT=production bash scripts/netlify-build.sh
    startCommand: cd apps/web && node_modules/.bin/next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Tâches du matin : « 1 » seulement quand Netlify ne les lance plus (sinon doublons).
      - key: RUN_DAILY_ON_PING
        value: "0"
      - key: STORAGE_DRIVER
        value: database
      # Jamais « true » en ligne : la boîte de test serait lisible par tous (liens de connexion).
      - key: ENABLE_DEV_MAILBOX
        value: "false"
      # Ancien hébergement : ses fichiers sont recopiés dans la base au premier réveil.
      - key: LEGACY_FILES_URL
        value: https://radiant-vacherin-c49bd4.netlify.app
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: https://e7ddc919225e2985ceb43e5c4359a91e@o4512267264393216.ingest.de.sentry.io/4512386726035536
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Base Neon : renseignée à la création, jamais dans le dépôt.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: sebt-sites
    runtime: node
    plan: free
    region: ohio
    branch: claude/saas-modulaire-prompt-bgo7mm
    autoDeploy: true
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --filter '@quercy/sites...'
      && pnpm --filter '@quercy/sites...' build
    startCommand: cd apps/sites && node_modules/.bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Adresse publique du logiciel (le nom d'hôte interne n'est pas joignable en gratuit).
      - key: SEBT_API_URL
        value: https://sebt-t5gw.onrender.com

  # Vitrine sebt (site public) : projet à part dans apps/vitrine, hors de l'espace de travail.
  - type: web
    name: sebt-vitrine
    runtime: node
    plan: free
    region: ohio
    branch: claude/saas-modulaire-prompt-bgo7mm
    autoDeploy: true
    buildFilter:
      paths:
        - apps/vitrine/**
    buildCommand: >-
      corepack enable && cd apps/vitrine && pnpm install --ignore-workspace --frozen-lockfile
      && pnpm build
    startCommand: cd apps/vitrine && node_modules/.bin/next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_URL_LOGICIEL
        value: https://sebt-t5gw.onrender.com
